name: Quality checks
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_ENV: preview
          NEXT_PUBLIC_ENABLE_TRACKING_PREVIEW: "true"
          NEXT_PUBLIC_CLARITY_PROJECT_ID: testclarity
      - run: npm run test:e2e -- tests/foundations.spec.ts tests/integrations.spec.ts
        env:
          CONTACT_LOCAL_RATE_LIMIT: "true"
      - run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_SCENE_DEBUG: "true"
          CONTACT_DELIVERY_ENABLED: "true"
          NEXT_PUBLIC_VERCEL_ENV: preview
          NEXT_PUBLIC_ENABLE_TRACKING_PREVIEW: "true"
          NEXT_PUBLIC_CLARITY_PROJECT_ID: testclarity
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_ENABLE_SCENE_DEBUG: "true"
          CONTACT_DELIVERY_ENABLED: "true"
          CONTACT_LOCAL_RATE_LIMIT: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
